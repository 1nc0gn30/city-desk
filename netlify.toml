[build]
  publish = "site"
  command = "node build.js"

[build.environment]
  NODE_VERSION = "20.17.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# No catch-all rewrite: this is a static multi-page site, so unknown URLs
# should get site/404.html with a real 404 status (better for SEO and users).
