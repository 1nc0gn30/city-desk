[build]
  publish = "site"
  command = "node build.js"

[build.environment]
  NODE_VERSION = "20.17.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Dynamic city x trade routing: static 50 cities serve directly; any additional US city slug
# rewrites cleanly with HTTP 200 to the trade template and is personalized by city_engine.js.
[[redirects]]
  from = "/cities/:city/:trade/*"
  to = "/cities/virginia-beach-va/:trade/index.html"
  status = 200

[[redirects]]
  from = "/cities/:city/*"
  to = "/cities/virginia-beach-va/index.html"
  status = 200

